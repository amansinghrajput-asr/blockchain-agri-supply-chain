services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agri_chain
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://agri:agri@postgres:5432/agri_chain
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres
      - ai-service
    ports:
      - "4000:4000"

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
